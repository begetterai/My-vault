<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Чек-лист смены</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap">
<style>
  /* Ромашка: жёлтая сердцевина — фирменный цвет, белый лепесток — фон,
     тёплый нейтральный — всё остальное. Зелёный и красный оставлены
     смыслу: сделано / не сделано, и в фирменный набор не входят. */
  :root{
    --brand:#E8A317; --brand-2:#C88700; --on-brand:#1B1409;
    --bg:#FFFFFF; --card:#FFFFFF; --wash:#F6F3EC;
    --ink:#191410; --ink-2:#6E6459; --line:#E4DED2;
    --ok:#1E7A46; --ok-soft:#E8F3EC; --bad:#C0362C; --bad-soft:#FBECEA;
    --shadow:0 1px 2px rgba(25,20,16,.06), 0 8px 24px rgba(25,20,16,.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:#F0B429; --brand-2:#F5C542; --on-brand:#1B1409;
      --bg:#141210; --card:#1D1A16; --wash:#221E19;
      --ink:#F3EFE8; --ink-2:#A79C8D; --line:#332E27;
      --ok:#5BC98A; --ok-soft:#17281F; --bad:#F08279; --bad-soft:#2C1B19;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --brand:#F0B429; --brand-2:#F5C542; --on-brand:#1B1409;
    --bg:#141210; --card:#1D1A16; --wash:#221E19;
    --ink:#F3EFE8; --ink-2:#A79C8D; --line:#332E27;
    --ok:#5BC98A; --ok-soft:#17281F; --bad:#F08279; --bad-soft:#2C1B19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.45 "Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       padding:0 0 104px;-webkit-font-smoothing:antialiased}

  /* ── шапка ──────────────────────────────────────────────────────────── */
  header{position:sticky;top:0;z-index:5;background:var(--bg);
         border-bottom:1px solid var(--line);padding:12px 16px 10px}
  .brandline{display:flex;align-items:center;gap:10px}
  .mark{flex:none;width:30px;height:30px}
  .titles{min-width:0;flex:1}
  .who{font-family:Manrope,"Golos Text",sans-serif;font-weight:800;
       font-size:17px;letter-spacing:-.01em;line-height:1.2;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub{color:var(--ink-2);font-size:13.5px;margin-top:1px}
  .bar{height:5px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
  .bar>i{display:block;height:100%;width:0;border-radius:99px;
         background:linear-gradient(90deg,var(--brand),var(--brand-2));
         transition:width .25s ease}

  main{padding:16px;max-width:640px;margin:0 auto}
  h2{font-family:Manrope,"Golos Text",sans-serif;font-size:12.5px;font-weight:700;
     text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);
     margin:26px 0 10px;display:flex;align-items:center;gap:8px}
  h2::after{content:"";flex:1;height:1px;background:var(--line)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

  /* ── выбор чек-листа ────────────────────────────────────────────────── */
  .pick{display:grid;gap:12px;margin-top:8px}
  .big{display:block;width:100%;padding:20px 18px;border:1px solid var(--line);
       background:var(--card);border-radius:18px;text-align:left;
       font-family:Manrope,"Golos Text",sans-serif;font-size:19px;font-weight:700;
       cursor:pointer;box-shadow:var(--shadow);
       border-left:5px solid var(--brand)}
  .big:active{transform:scale(.99)}
  .big .sub{font-family:"Golos Text",sans-serif;font-weight:500;
            font-variant-numeric:tabular-nums;margin-top:4px}

  /* ── пункт чек-листа ────────────────────────────────────────────────── */
  .item{display:flex;gap:10px;align-items:center;padding:12px 12px 12px 12px;
        border:1px solid var(--line);border-left:4px solid transparent;
        border-radius:16px;background:var(--card);
        margin-bottom:8px;transition:border-color .15s,background .15s}
  .item.unset{border-left-color:var(--brand)}
  .item .txt{flex:1;min-width:0;font-size:15.5px}
  .item .norm{display:block;color:var(--ink-2);font-size:13px;margin-top:3px}
  .item .num{color:var(--ink-2);font-family:Manrope,sans-serif;font-weight:700;
             font-size:13px;font-variant-numeric:tabular-nums;min-width:20px}
  .tog{display:flex;gap:8px;flex:none}
  .tog button{width:50px;height:50px;border-radius:14px;border:1.5px solid var(--line);
              background:transparent;font-size:21px;cursor:pointer;line-height:1;
              color:var(--ink-2);transition:all .12s}
  .tog button[data-v="1"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
  .tog button[data-v="0"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}

  /* ── поля ───────────────────────────────────────────────────────────── */
  label{display:block;margin:16px 0 6px;font-weight:600;font-size:15px}
  input[type=text],input[type=number],input[type=time],textarea{
      width:100%;padding:15px;border:1.5px solid var(--line);border-radius:14px;
      background:var(--wash);color:var(--ink);font:inherit;
      font-variant-numeric:tabular-nums}
  input:focus,textarea:focus{border-color:var(--brand);background:var(--card);outline:none}
  textarea{min-height:92px;resize:vertical}
  .hint{color:var(--ink-2);font-size:13px;margin-top:6px}
  .hint.bad{color:var(--bad);font-weight:600}

  /* ── фото ───────────────────────────────────────────────────────────── */
  .photo{border:1.5px dashed var(--line);border-radius:16px;padding:16px;
         background:var(--wash);margin-bottom:10px}
  .photo img{width:100%;border-radius:12px;margin-top:12px;display:block}
  .shoot{display:inline-block;padding:13px 18px;border-radius:13px;
         background:var(--brand);color:var(--on-brand);
         margin-top:12px;cursor:pointer;font-weight:700}

  /* ── низ ────────────────────────────────────────────────────────────── */
  .foot{position:fixed;left:0;right:0;bottom:0;
        padding:12px 16px calc(12px + env(safe-area-inset-bottom));
        background:var(--bg);border-top:1px solid var(--line)}
  .send{display:block;width:100%;max-width:608px;margin:0 auto;padding:18px;
        border-radius:16px;border:0;background:var(--brand);color:var(--on-brand);
        font-family:Manrope,"Golos Text",sans-serif;font-size:17px;font-weight:800;
        cursor:pointer}
  .send[disabled]{background:var(--wash);color:var(--ink-2);
                  border:1.5px solid var(--line);font-weight:700;font-size:15px}
  .send small{display:block;font-family:"Golos Text",sans-serif;font-weight:500;
              font-size:12.5px;opacity:.8;margin-top:3px}
  .msg{padding:14px;border-radius:14px;border:1px solid var(--line);
       background:var(--wash);margin:12px 0;font-size:14.5px;white-space:pre-line}
  .note{width:100%;padding:15px;border:1.5px solid var(--line);border-radius:14px;
        background:transparent;font-weight:600;margin-top:12px;cursor:pointer;
        color:var(--ink-2)}
  .done{text-align:center;padding:44px 20px}
  .done .k{font-family:Manrope,sans-serif;font-size:46px;font-weight:800;
           margin:12px 0;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .hidden{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="brandline">
    <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
      <g fill="var(--brand)">
        <ellipse cx="20" cy="8"  rx="4.4" ry="7"/>
        <ellipse cx="20" cy="32" rx="4.4" ry="7"/>
        <ellipse cx="8"  cy="20" rx="7" ry="4.4"/>
        <ellipse cx="32" cy="20" rx="7" ry="4.4"/>
        <ellipse cx="11.5" cy="11.5" rx="4.4" ry="7" transform="rotate(-45 11.5 11.5)"/>
        <ellipse cx="28.5" cy="28.5" rx="4.4" ry="7" transform="rotate(-45 28.5 28.5)"/>
        <ellipse cx="28.5" cy="11.5" rx="4.4" ry="7" transform="rotate(45 28.5 11.5)"/>
        <ellipse cx="11.5" cy="28.5" rx="4.4" ry="7" transform="rotate(45 11.5 28.5)"/>
      </g>
      <circle cx="20" cy="20" r="6" fill="var(--ink)"/>
    </svg>
    <div class="titles">
      <div class="who" id="who">Загрузка…</div>
      <div class="sub" id="sub"></div>
    </div>
  </div>
  <div class="bar hidden" id="bar"><i></i></div>
</header>

<main>
  <div id="pick" class="hidden">
    <h2>Что заполняем</h2>
    <div class="pick" id="pickList"></div>
  </div>

  <div id="form" class="hidden"></div>

  <div id="done" class="done hidden">
    <div style="font-size:46px">✅</div>
    <div class="k" id="doneK"></div>
    <div id="doneT" class="sub"></div>
    <button class="note" onclick="location.reload()">Заполнить ещё</button>
  </div>

  <div id="err" class="msg hidden"></div>
</main>

<div class="foot hidden" id="foot">
  <button class="send" id="send" disabled>Отправить</button>
</div>
<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const initData = tg?.initData || '';
const $ = s => document.querySelector(s);
let DATA = null, kind = null, marks = {}, measures = {}, photos = {}, started = 0;

const fail = m => { $('#err').textContent = m; $('#err').classList.remove('hidden'); };

async function boot(){
  try{
    const r = await fetch('/api/init?initData=' + encodeURIComponent(initData));
    const j = await r.json();
    if(!r.ok){
      $('#who').textContent = 'Нет доступа';
      return fail((j.error || '') + (j.chat_id
        ? '\n\nТвой ID: ' + j.chat_id + '\nПередай его руководителю — он добавит тебя.'
        : ''));
    }
    DATA = j;
    $('#who').textContent = j.name + ' · ' + j.point;
    document.title = (j.company || '') + ' — чек-лист';
    $('#sub').textContent = j.day;
    const box = $('#pickList'); box.innerHTML = '';
    for(const k of Object.keys(j.lists)){
      const b = document.createElement('button');
      b.className = 'big';
      const dl = j.lists[k].deadline ? ' · до ' + j.lists[k].deadline : '';
      b.innerHTML = j.lists[k].title +
        '<div class="sub">' + j.lists[k].code + dl + '</div>';
      b.onclick = () => start(k);
      box.appendChild(b);
    }
    $('#pick').classList.remove('hidden');
  }catch(e){ fail('Не открылось: ' + e.message); }
}

function start(k){
  kind = k; started = Date.now(); marks = {}; measures = {}; photos = {};
  const L = DATA.lists[k];
  $('#pick').classList.add('hidden');
  $('#bar').classList.remove('hidden');
  $('#foot').classList.remove('hidden');
  $('#sub').textContent = L.title + ' · ' + DATA.day;

  const f = $('#form'); f.innerHTML = ''; f.classList.remove('hidden');
  L.blocks.forEach(bl => {
    const h = document.createElement('h2'); h.textContent = bl.name; f.appendChild(h);
    bl.items.forEach(it => f.appendChild(itemRow(it)));
  });

  if(L.measures.length){
    const h = document.createElement('h2'); h.textContent = 'Замеры'; f.appendChild(h);
    L.measures.forEach(m => {
      const w = document.createElement('div');
      const lim = (m.min != null ? ' min="' + m.min + '"' : '')
                + (m.max != null ? ' max="' + m.max + '"' : '');
      w.innerHTML = '<label>' + m.q + '</label>' +
        '<input type="number" step="any" inputmode="decimal" id="m' + m.n + '"' + lim + '>' +
        '<div class="hint" id="h' + m.n + '">Норма: ' + m.norm + ' ' + m.unit
        + (m.min != null ? ' · ввод от ' + m.min + ' до ' + m.max : '') + '</div>';
      const inp = w.querySelector('input'), hint = w.querySelector('.hint');
      inp.oninput = e => {
        const raw = e.target.value.trim();
        const v = parseFloat(raw.replace(',', '.'));
        measures[m.n] = raw;
        hint.classList.remove('bad');
        if (raw === '' || isNaN(v)) {
          hint.textContent = 'Норма: ' + m.norm + ' ' + m.unit;
        } else if ((m.min != null && v < m.min) || (m.max != null && v > m.max)) {
          hint.textContent = 'Так не бывает. Допустимо от ' + m.min + ' до ' + m.max;
          hint.classList.add('bad');
          measures[m.n] = '';
        } else if ((m.ok_min != null && v < m.ok_min) || (m.ok_max != null && v > m.ok_max)) {
          hint.textContent = '⚠️ ' + v + ' ' + m.unit + ' — вне нормы (' + m.norm
            + '). Запишем как есть, управляющему уйдёт сигнал.';
          hint.classList.add('bad');
        } else {
          hint.textContent = 'Норма: ' + m.norm + ' ' + m.unit + ' — в норме';
        }
        paint();
      };
      f.appendChild(w);
    });
  }

  if(L.photos.length){
    const h = document.createElement('h2'); h.textContent = 'Фото'; f.appendChild(h);
    L.photos.forEach(p => f.appendChild(photoRow(p)));
  }

  const h = document.createElement('h2'); h.textContent = 'Итог'; f.appendChild(h);
  const t = document.createElement('div');
  t.innerHTML = '<label>' + L.ask_time + '</label>' +
    '<input type="time" id="time" step="60">' +
    '<label>Комментарий по невыполненным</label>' +
    '<textarea id="comment" placeholder="Что не так и что с этим делаешь"></textarea>' +
    '<div class="hint" id="chint"></div>';
  f.appendChild(t);
  t.querySelector('#time').oninput = paint;
  t.querySelector('#comment').oninput = paint;

  const nb = document.createElement('button');
  nb.className = 'note'; nb.textContent = '💬 Заметка / задача';
  nb.onclick = sendNote; f.appendChild(nb);

  $('#send').onclick = submit;
  paint();
}

function itemRow(it){
  const d = document.createElement('div');
  d.className = 'item unset'; d.id = 'i' + it.n;
  d.innerHTML = '<span class="num">' + it.n + '</span>' +
    '<span class="txt">' + it.text +
    (it.norm ? '<span class="norm">' + it.norm + '</span>' : '') + '</span>';
  const tog = document.createElement('span'); tog.className = 'tog';
  [['1','✓'],['0','✕']].forEach(([v,ch]) => {
    const b = document.createElement('button');
    b.dataset.v = v; b.textContent = ch; b.setAttribute('aria-pressed','false');
    b.onclick = () => {
      marks[it.n] = v === '1';
      tog.querySelectorAll('button').forEach(x =>
        x.setAttribute('aria-pressed', x.dataset.v === v ? 'true' : 'false'));
      d.classList.remove('unset');
      tg?.HapticFeedback?.selectionChanged?.();
      paint();
    };
    tog.appendChild(b);
  });
  d.appendChild(tog);
  return d;
}

function photoRow(p){
  const d = document.createElement('div');
  d.className = 'photo';
  d.innerHTML = '<div><b>' + p.text + '</b></div>' +
    '<div class="hint">Снимок должен быть сделан сейчас</div>';
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.capture = 'environment';
  inp.style.display = 'none';
  const lab = document.createElement('span');
  lab.className = 'shoot'; lab.textContent = '📷 Сфотографировать';
  lab.onclick = () => inp.click();
  const img = document.createElement('img'); img.className = 'hidden';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    lab.textContent = 'Обрабатываю…';
    const url = await shrink(f);
    photos[p.n] = url; img.src = url; img.classList.remove('hidden');
    lab.textContent = '📷 Переснять'; paint();
  };
  d.append(lab, inp, img);
  return d;
}

function shrink(file){
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const max = 1280, k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.75));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function paint(){
  const L = DATA.lists[kind];
  const total = L.blocks.reduce((s,b) => s + b.items.length, 0);
  const done = Object.keys(marks).length;
  $('#bar').firstElementChild.style.width = (done/total*100) + '%';
  const fails = Object.entries(marks).filter(([,v]) => !v).length;
  const needC = fails > 0;
  const okM = L.measures.every(m => (measures[m.n] ?? '') !== '');
  const okP = L.photos.every(p => photos[p.n]);
  const okT = /^\d{1,2}:\d{2}$/.test(($('#time')?.value || '').trim());
  const okC = !needC || ($('#comment')?.value || '').trim().length > 2;
  if($('#chint')){
    $('#chint').textContent = needC
      ? 'Не выполнено пунктов: ' + fails + ' — комментарий обязателен'
      : '';
    $('#chint').classList.toggle('bad', needC && !okC);
  }
  const ready = done === total && okM && okP && okT && okC;
  $('#send').disabled = !ready;
  if(ready){ $('#send').textContent = 'Отправить'; }
  else {
    const left = [];
    if(done < total) left.push('пунктов: ' + (total - done));
    if(!okM) left.push('замеры');
    if(!okP) left.push('фото');
    if(!okT) left.push('время');
    if(!okC) left.push('комментарий');
    $('#send').innerHTML = 'Отмечено ' + done + ' из ' + total
      + '<small>осталось: ' + left.join(' · ') + '</small>';
  }
}

async function submit(){
  $('#send').disabled = true; $('#send').textContent = 'Отправляю…';
  const body = {
    initData, kind, marks, measures,
    photos: Object.entries(photos).map(([n,data]) => ({n:+n, data})),
    time: $('#time').value.trim(),
    comment: $('#comment').value.trim(),
    seconds: Math.round((Date.now() - started) / 1000)
  };
  try{
    const r = await fetch('/api/submit', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'не сохранилось');
    $('#form').classList.add('hidden'); $('#foot').classList.add('hidden');
    $('#bar').classList.add('hidden');
    $('#doneK').textContent = j.done + ' из ' + j.total;
    $('#doneT').textContent = 'Заняло ' + j.minutes + ' мин'
      + (j.fast ? ' — слишком быстро, управляющий это увидит' : '');
    $('#done').classList.remove('hidden');
    tg?.HapticFeedback?.notificationOccurred?.('success');
  }catch(e){
    fail(e.message); $('#send').disabled = false; $('#send').textContent = 'Отправить';
  }
}

async function sendNote(){
  const t = prompt('Что добавить в регламент или что сделать?\n\n'
    + 'Пиши фразой: «Купить второй термощуп, одного на две станции не хватает»');
  if(!t) return;
  const r = await fetch('/api/note', {method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({initData, text: t,
                          source: DATA.lists[kind].code + ' · Mini App'})});
  const j = await r.json();
  alert(j.ok ? 'Записал в «Идеи и задачи»' : (j.error || 'не записалось'));
}

boot();
</script>
</body>
</html>
