<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Деньги</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Цвета берём из телеграма: приложение открывается внутри чата, и свой
     светлый фон в тёмном чате бьёт по глазам. На каждый цвет — запасной:
     если открыть адрес в браузере, переменных телеграма нет, и без запасных
     экран стал бы невидимым. */
  :root{
    --bg:var(--tg-theme-bg-color,#17212b);
    --card:var(--tg-theme-secondary-bg-color,#202b36);
    --ink:var(--tg-theme-text-color,#e9edf2);
    --dim:var(--tg-theme-hint-color,#8c9aa8);
    --accent:var(--tg-theme-button-color,#5ca9e8);
    --on-accent:var(--tg-theme-button-text-color,#ffffff);
    --bad:var(--tg-theme-destructive-text-color,#e0705f);
    --warn:#d6a13f;
    --ok:#4cc38a;
    --line:color-mix(in srgb, var(--ink) 14%, transparent);
    --sunk:color-mix(in srgb, var(--ink) 7%, transparent);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    padding:10px 12px calc(86px + env(safe-area-inset-bottom));
    max-width:600px;margin:0 auto;
  }
  .num{font-variant-numeric:tabular-nums}
  .dim{color:var(--dim)}
  .hide{display:none!important}

  /* ── крупная строка сверху ──────────────────────────────── */
  .top{padding:4px 2px 12px}
  .top .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;
            color:var(--dim)}
  .top .big{font-size:38px;font-weight:700;letter-spacing:-.02em;
            line-height:1;margin-top:5px}
  .top .sub{color:var(--dim);font-size:13px;margin-top:6px}

  .tabs{display:flex;gap:6px;margin-bottom:10px}
  .tabs button{flex:1;padding:9px 0;border:0;border-radius:9px;
               background:var(--card);color:var(--dim);font:inherit;
               font-size:14px;cursor:pointer}
  .tabs button.on{background:var(--ink);color:var(--bg);font-weight:600}

  .card{background:var(--card);border-radius:12px;padding:11px;
        margin-bottom:9px}
  h2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
     color:var(--dim);font-weight:600;margin:14px 0 6px}

  input,select{font:inherit;color:var(--ink);background:var(--sunk);
    border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
  input::placeholder{color:var(--dim)}
  #amount{font-size:30px;font-weight:600;text-align:center;padding:12px}
  /* Подсказка тише самой цифры: вверху уже стоит крупное «на руках»,
     и два жирных числа на экране спорят друг с другом. */
  #amount::placeholder{font-size:17px;font-weight:400}
  .two{display:flex;gap:8px;margin-top:8px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
  .chips button{border:0;border-radius:8px;padding:6px 9px;font:inherit;
                font-size:13px;background:var(--sunk);color:var(--ink);
                cursor:pointer}
  .chips button.on{background:var(--accent);color:var(--on-accent);
                   font-weight:600}
  .go{display:block;width:100%;margin-top:10px;padding:13px;border:0;
      border-radius:11px;background:var(--accent);color:var(--on-accent);
      font:inherit;font-weight:600;font-size:15px;cursor:pointer}
  .go[disabled]{opacity:.5}
  .flat{background:var(--sunk);color:var(--ink);font-weight:500}

  /* ── плотные списки ─────────────────────────────────────── */
  .row{display:flex;justify-content:space-between;align-items:baseline;
       gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .name{flex:1;min-width:0;text-align:left;overflow:hidden;
             text-overflow:ellipsis;white-space:nowrap}
  .row .val{white-space:nowrap;text-align:right}
  .row small{display:block;color:var(--dim);font-size:11.5px;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .over{color:var(--bad)} .near{color:var(--warn)}
  .x{border:0;background:none;color:var(--dim);font:inherit;font-size:18px;
     line-height:1;padding:2px 4px;cursor:pointer}

  /* Неделя привычки: семь клеток, одна строка, ничего лишнего. */
  .week{display:flex;gap:5px;margin:10px 0 4px}
  .week div{flex:1;text-align:center;padding:7px 0;border-radius:8px;
            background:var(--sunk);font-size:12px;color:var(--dim)}
  .week .was, .week .no{color:var(--ink)}
  .week div b{display:block;font-size:15px;margin-top:2px}
  .week .was{background:var(--accent);color:var(--on-accent)}
  .week .no{background:color-mix(in srgb,var(--bad) 30%,transparent)}
  .week .plan{outline:1px dashed var(--line)}
  .week .fut{opacity:.45}
  .two-go{display:flex;gap:8px;margin-top:10px}
  .two-go button{flex:1}

  /* Полоска месяца. Единственная уместная: календарный месяц назначен
     извне, а не собой — в отличие от привычек, где полоска врёт. */
  .mbar{height:3px;border-radius:2px;background:var(--sunk);margin-top:9px}
  .mbar i{display:block;height:3px;border-radius:2px;background:var(--accent)}
  .mbar i.w{background:var(--warn)} .mbar i.b{background:var(--bad)}

  .crumb{display:flex;align-items:center;gap:8px;margin-bottom:2px}
  .crumb b{font-size:17px}
  .crumb .x{font-size:22px;color:var(--ink)}

  /* Блок второго уровня: название, живое число, стрелка. */
  .blk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
       background:var(--card);border:0;border-radius:12px;padding:14px 13px;
       margin-bottom:9px;color:var(--ink);font:inherit;cursor:pointer}
  .blk .ic{font-size:22px;line-height:1}
  .blk .t{flex:1;min-width:0}
  .blk .t b{font-size:16px;display:block}
  .blk .t small{color:var(--dim);font-size:12.5px}
  .blk .go-arrow{color:var(--dim);font-size:18px}

  /* Плитки-метрики 2×2: иконка в подложке, крупное число, подпись.
     Взято у Lifehub — так число читается за полвзгляда. */
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tile{background:var(--card);border-radius:12px;padding:12px}
  .tile .ic{width:30px;height:30px;border-radius:9px;display:grid;
            place-items:center;font-size:15px;background:var(--sunk)}
  .tile .v{font-size:21px;font-weight:700;margin-top:8px;
           font-variant-numeric:tabular-nums}
  .tile .c{color:var(--dim);font-size:12px;margin-top:2px}
  .tile .v.good{color:var(--ok)} .tile .v.bad{color:var(--bad)}
  .tile .v.warn{color:var(--warn)}

  /* Столбики динамики. Рисуем сами: библиотека ради шести столбиков —
     лишний вес и лишнее место, где ломается. */
  .chart{display:flex;align-items:flex-end;gap:7px;height:110px;
         margin-top:10px}
  .chart .col{flex:1;display:flex;flex-direction:column;
              justify-content:flex-end;gap:2px;height:100%}
  .chart .col i{display:block;border-radius:3px;min-height:2px}
  .chart .col i.inc{background:var(--ok)}
  .chart .col i.sp{background:var(--accent)}
  .chart .col i.sv{background:var(--warn)}
  .chart .lab{text-align:center;color:var(--dim);font-size:11px;
              margin-top:5px}
  .legend{display:flex;gap:12px;color:var(--dim);font-size:12px;
          margin-top:8px;flex-wrap:wrap}
  .legend s{width:9px;height:9px;border-radius:3px;display:inline-block;
            margin-right:4px;text-decoration:none}

  /* Нижняя панель — как у Lifehub: палец достаёт, всегда на виду. */
  .bar{position:fixed;left:0;right:0;bottom:0;display:flex;
       background:var(--card);border-top:1px solid var(--line);
       padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:8}
  .bar button{flex:1;border:0;background:none;color:var(--dim);
              font:inherit;font-size:10.5px;padding:4px 0;cursor:pointer}
  .bar button b{display:block;font-size:19px;line-height:1.15;
                font-weight:400}
  .bar button.on{color:var(--accent);font-weight:600}
  .fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));
       width:54px;height:54px;border-radius:27px;border:0;z-index:9;
       background:var(--accent);color:var(--on-accent);font-size:28px;
       line-height:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)}

  .acc{display:flex;align-items:center;gap:8px;padding:5px 0}
  .acc span{flex:1}
  .acc input{width:44%;padding:8px;text-align:right}

  #toast{position:fixed;left:12px;right:12px;bottom:12px;
         background:var(--ink);color:var(--bg);padding:11px;border-radius:11px;
         display:none;z-index:9;max-width:576px;margin:0 auto;font-size:14px}
</style>
</head>
<body>

<div class="top" id="topLine">
  <div class="lbl">Свободно</div>
  <div class="big num" id="cash">—</div>
  <div class="sub num" id="sub">&nbsp;</div>
  <div class="mbar"><i id="mbar"></i></div>
</div>

<section id="pQuick">
  <div class="tiles" id="qTiles"></div>
  <div id="qAsk"></div>
  <div id="qTop"></div>
  <div class="card" id="qBtns">
    <div class="two-go">
      <button class="go" id="qSpend">➖ Расход</button>
      <button class="go flat" id="qTask">✚ Задача</button>
    </div>
    <div class="two-go">
      <button class="go flat" id="qMove">🔁 Перевод</button>
      <button class="go flat" id="qIn">➕ Доход</button>
    </div>
  </div>
</section>

<div class="hide" id="subHead">
  <div class="chips" id="subs"></div>
</div>

<section id="pWrite" class="hide">
  <div class="card">
    <input id="amount" inputmode="decimal" placeholder="Сумма">
    <div class="two">
      <select id="kind">
        <option value="расход">Расход</option>
        <option value="доход">Доход</option>
        <option value="накопление">Накопление</option>
        <option value="погашение">Погашение кредита</option>
        <option value="перевод">Перевод между кошельками</option>
      </select>
      <input id="date" type="date">
    </div>
    <div class="chips" id="cats"></div>
    <h2 id="walLbl">Откуда</h2>
    <div class="chips" id="wallets"></div>
    <h2 id="toLbl" class="hide">Куда</h2>
    <div class="chips hide" id="toWallets"></div>
    <input id="comment" placeholder="На что — коротко" style="margin-top:8px">
    <button class="go" id="save">Записать</button>
  </div>

  <h2>Последние записи</h2>
  <div class="card" id="last"></div>
</section>

<section id="pHabits" class="hide"></section>

<section id="pTasks" class="hide">
  <div class="card">
    <div class="two">
      <input id="tText" placeholder="Что сделать">
      <input id="tDue" type="date" style="width:46%">
    </div>
    <button class="go" id="tAdd">Добавить</button>
  </div>
  <div id="taskList"></div>
</section>

<section id="pLimits" class="hide">
  <div class="card" id="limits"></div>
  <h2>Без лимита</h2>
  <div class="card dim" id="nolimit"></div>
</section>

<section id="pDebts" class="hide">
  <div class="card" id="debts"></div>
</section>

<section id="pWallets" class="hide">
  <div class="card" id="bal"></div>
</section>

<section id="pMonth" class="hide">
  <div class="card" id="month"></div>
</section>

<section id="pGoals" class="hide"></section>
<section id="pCycle" class="hide"></section>
<section id="pMeas" class="hide"></section>
<section id="pMatrix" class="hide"></section>
<section id="pMGoals" class="hide"></section>
<section id="pSet" class="hide">
  <div class="chips" id="setKinds"></div>
  <div id="setList"></div>
</section>

<section id="pTrend" class="hide">
  <div class="card">
    <b>Деньги по месяцам</b>
    <div class="chart" id="chart"></div>
    <div id="chartLabs" style="display:flex;gap:7px"></div>
    <div class="legend">
      <span><s style="background:var(--ok)"></s>заработано</span>
      <span><s style="background:var(--accent)"></s>потрачено</span>
      <span><s style="background:var(--warn)"></s>отложено</span>
    </div>
  </div>
  <h2>Категории по месяцам</h2>
  <div class="card" id="catTrend"></div>
</section>

<button class="fab" id="fab">+</button>

<nav class="bar" id="bar">
  <button data-b="today"><b>◎</b>Сегодня</button>
  <button data-b="money"><b>₵</b>Деньги</button>
  <button data-b="body"><b>♥</b>Ритм</button>
  <button data-b="todo"><b>✓</b>Дела</button>
  <button data-b="goals"><b>◆</b>Цели</button>
</nav>

<div id="toast"></div>

<script>
const tg = window.Telegram?.WebApp || null;
try{ tg?.ready(); tg?.expand(); }catch(e){}
const initData = tg?.initData || '';
let D = null, CAT = '', BUSY = false, FIRST = true;
let WAL = '', TO = '';
const WAL_KEY = 'dengi.wallet';
try{ WAL = localStorage.getItem(WAL_KEY) || ''; }catch(e){}

const $ = s => document.querySelector(s);
const money = n => {
  const v = Number(n) || 0;
  return Number.isInteger(v) ? v.toLocaleString('ru-RU')
    : v.toLocaleString('ru-RU', {minimumFractionDigits: 2,
                                 maximumFractionDigits: 2});
};

let toastT = null;
function note(text){
  const t = $('#toast');
  t.textContent = text; t.style.display = 'block';
  clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3500);
}

async function post(url, body){
  const r = await fetch(url, {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(Object.assign({initData}, body))});
  return r.json();
}

/* Категории — по выбранному типу: в доходе не нужны «Продукты»,
   в расходе — «Зарплата». */
function catsFor(kind){
  if(kind === 'доход') return D.income_cats;
  if(kind === 'накопление') return D.saving_cats;
  if(kind === 'погашение') return ['Оплата кредита'];
  return D.cats;
}

/* Кошелёк запоминается: платишь чаще всего с одного, и выбирать его
   каждый раз — то самое трение, от которого уходим. */
function drawWallets(){
  const pay = $('#kind').value === 'перевод';
  $('#toLbl').classList.toggle('hide', !pay);
  $('#toWallets').classList.toggle('hide', !pay);
  $('#walLbl').textContent = pay ? 'Откуда' : ($('#kind').value === 'доход'
                                               ? 'Куда пришли' : 'Откуда');
  if(!D.wallets.includes(WAL)) WAL = D.wallets[0] || '';
  if(!D.wallets.includes(TO)) TO = D.wallets.find(w => w !== WAL) || '';
  [['#wallets', 'WAL'], ['#toWallets', 'TO']].forEach(([sel, which]) => {
    const box = $(sel); box.innerHTML = '';
    D.wallets.forEach(w => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = w;
      if(w === (which === 'WAL' ? WAL : TO)) b.className = 'on';
      b.onclick = () => {
        if(which === 'WAL'){ WAL = w; try{ localStorage.setItem(WAL_KEY, w); }catch(e){} }
        else TO = w;
        drawWallets();
      };
      box.appendChild(b);
    });
  });
}

/* Долги: остаток, платёж, месяцев до нуля и заплачено ли в этом месяце.
   Вопрос «я в этом месяце платил?» раньше решался по памяти — то есть
   не решался. Кнопка платежа рядом: решил — нажал, не выходя с экрана. */
/* Дела: захват одной строкой, три группы, галочка одним тапом.
   Круг слева закрывает, стрелка переносит на завтра. Третий перенос —
   вопрос: дело, которое переносишь третий раз, чаще всего делать
   не собираются, и честнее спросить, чем копить мёртвый список. */
async function taskAct(url, body){
  const j = await post(url, body);
  note(j.ok ? (j.line || 'Готово') : (j.error || 'Не вышло'));
  if(j.ok && j.ask &&
     confirm('Переносишь третий раз. Оставляем в списке?\n\n' +
             'Отмена — закрою как несделанное.')) { /* оставляем */ }
  else if(j.ok && j.ask) await post('/api/task_close', {line: body.line});
  if(j.ok) load();
}

function taskRow(t){
  const d = document.createElement('div'); d.className = 'row';
  const ok = document.createElement('button');
  ok.className = 'x'; ok.type = 'button'; ok.textContent = '○';
  ok.title = 'Сделано';
  ok.onclick = () => taskAct('/api/task_close', {line: t.line});
  const mid = document.createElement('div'); mid.className = 'name';
  mid.textContent = t.text;
  const sub = [t.due || 'без срока', t.project, t.area,
               t.moved ? 'переносов ' + t.moved : ''].filter(Boolean);
  const s2 = document.createElement('small'); s2.textContent = sub.join(' · ');
  mid.appendChild(s2);
  const mv = document.createElement('button');
  mv.className = 'x'; mv.type = 'button'; mv.textContent = '→';
  mv.title = 'На завтра';
  mv.onclick = () => taskAct('/api/task_move', {line: t.line, days: 1});
  d.append(ok, mid, mv);
  return d;
}

/* Экран входа. Каждый блок исчезает, когда в нём пусто: пустой вход —
   хорошая новость, а не недоработка. */
function drawQuick(){
  // Что показывать — решает Азиз в «Сегодня → Настроить».
  const on = D.screen || {};
  const vis = (k, sel) => $(sel).classList.toggle('hide', on[k] === false);
  vis('Плитки', '#qTiles');
  vis('Полоска месяца', '.mbar');
  vis('Кнопки действий', '#qBtns');
  const ask = $('#qAsk'); ask.innerHTML = '';
  if(on['Вопросы дня'] === false) ask.classList.add('hide');
  else ask.classList.remove('hide');
  (D.habits || []).forEach(h => {
    const planned = h.week.find(d => d.date === D.today);
    if(h.today || !planned || !planned.planned) return;
    const c = document.createElement('div'); c.className = 'card';
    const t = document.createElement('div');
    t.innerHTML = `<b>${h.name} сегодня?</b>`;
    const g = document.createElement('div'); g.className = 'two-go';
    [['Был', 'был'], ['Не был', 'не был']].forEach(([label, val]) => {
      const b = document.createElement('button');
      b.className = 'go' + (val === 'был' ? '' : ' flat');
      b.textContent = label;
      b.onclick = () => answerHabit(h.name, val, '');
      g.appendChild(b);
    });
    c.append(t, g); ask.appendChild(c);
  });

  const top = $('#qTop'); top.innerHTML = '';
  top.classList.toggle('hide', on['Главные дела'] === false);
  const list = (D.tasks && D.tasks.top) || [];
  if(list.length){
    const h = document.createElement('h2'); h.textContent = 'Главные на сегодня';
    const c = document.createElement('div'); c.className = 'card';
    list.forEach(t => c.appendChild(taskRow(t)));
    top.append(h, c);
  }

  // Если отвечать и делать нечего — так и говорим. Пустой экран без слов
  // читается как поломка, а это хорошая новость.
  if(!ask.children.length && !top.children.length){
    const c = document.createElement('div');
    c.className = 'card dim';
    c.style.fontSize = '13.5px';
    c.textContent = 'На сегодня ничего не ждёт. Запиши трату или заведи '
                  + 'дело — или просто закрой.';
    top.appendChild(c);
  }
}

function drawTasks(){
  const box = $('#taskList'); box.innerHTML = '';
  const T = D.tasks || {late: [], today: [], later: [], done_week: 0};
  [['Просрочено', T.late, 'over'], ['Сегодня', T.today, ''],
   ['Дальше', T.later, '']].forEach(([title, list, cls]) => {
    if(!list.length) return;
    const h = document.createElement('h2');
    h.textContent = title + ' · ' + list.length;
    if(cls) h.className = cls;
    const c = document.createElement('div'); c.className = 'card';
    list.forEach(t => c.appendChild(taskRow(t)));
    box.append(h, c);
  });
  if(!T.late.length && !T.today.length && !T.later.length){
    box.innerHTML = '<div class="card dim">Дел нет. Напиши строкой сверху — '
                  + 'разберёшь потом.</div>';
  }
  const f = document.createElement('p');
  f.className = 'dim'; f.style.fontSize = '12.5px';
  f.textContent = 'За неделю закрыто: ' + T.done_week;
  box.appendChild(f);
}

$('#tAdd').onclick = async () => {
  const text = $('#tText').value.trim();
  if(!text){ note('Напиши, что сделать'); return; }
  const j = await post('/api/task_add', {text, due: $('#tDue').value});
  note(j.ok ? j.line : (j.error || 'Не вышло'));
  if(j.ok){ $('#tText').value = ''; load(); }
};

function drawDebts(){
  const box = $('#debts'); box.innerHTML = '';
  if(!(D.debts || []).length){
    box.innerHTML = '<span class="dim">Долгов нет. Заведи их в листе '
                  + '«Долги» — кому, остаток, платёж, день.</span>';
    return;
  }
  D.debts.forEach(d => {
    const sub = [d.to, d.day ? 'платёж ' + d.day + '-го' : '',
                 d.months ? d.months + ' мес. до нуля' : ''].filter(Boolean);
    const row = line(d.name, sub.join(' · '), money(d.left) + ' с');
    box.appendChild(row);
    const b = document.createElement('button');
    b.className = 'go' + (d.done ? ' flat' : '');
    b.textContent = d.done
      ? `В этом месяце заплачено ${money(d.paid)}`
      : `Заплатить ${money(d.pay)} с`;
    b.onclick = async () => {
      const raw = prompt(`Сколько платим по «${d.name}»?`, d.pay);
      if(raw === null) return;
      const j = await post('/api/debt_pay', {debt: d.name, amount: raw,
                                             wallet: WAL});
      note(j.ok ? j.line.replace(/<[^>]+>/g, '').split('\n')[0]
                : (j.error || 'Не вышло'));
      if(j.ok) load();
    };
    box.appendChild(b);
  });
}

function drawBal(){
  const box = $('#bal'); box.innerHTML = '';
  (D.balances || []).forEach(b =>
    box.appendChild(line(b.name, '', money(b.value) + ' с',
                         b.value < 0 ? 'over' : '')));
}

function drawCats(){
  // У перевода категории нет: деньги никуда не потрачены.
  const pay = $('#kind').value === 'перевод';
  $('#cats').classList.toggle('hide', pay);
  if(pay) return;
  const list = catsFor($('#kind').value);
  if(!list.includes(CAT)) CAT = list[0] || '';
  const box = $('#cats'); box.innerHTML = '';
  list.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = c;
    if(c === CAT) b.className = 'on';
    b.onclick = () => { CAT = c; drawCats(); };
    box.appendChild(b);
  });
}

function line(name, sub, val, cls){
  const d = document.createElement('div'); d.className = 'row';
  const l = document.createElement('div'); l.className = 'name';
  l.textContent = name;
  if(sub){ const s = document.createElement('small'); s.textContent = sub;
           l.appendChild(s); }
  const r = document.createElement('div');
  r.className = 'val num' + (cls ? ' ' + cls : '');
  r.textContent = val;
  d.append(l, r);
  return d;
}

function drawTop(){
  const m = D.month;
  $('#cash').textContent = money(m.free ?? m.cash) + ' с';
  const plan = D.limits.reduce((s, l) => s + l.limit, 0);
  const bits = ['Потрачено за месяц ' + money(m.spent) + ' из ' + money(plan)];
  if(m.put_away) bits.push('отложено ' + money(m.put_away));
  if(m.from_savings) bits.push('из накоплений ' + money(m.from_savings));
  $('#sub').textContent = bits.join(' · ');
  const pct = plan ? Math.round(m.spent / plan * 100) : 0;
  const bar = $('#mbar');
  bar.style.width = Math.min(pct, 100) + '%';
  bar.className = pct >= 100 ? 'b' : pct >= 80 ? 'w' : '';
}

function drawLimits(){
  const box = $('#limits'); box.innerHTML = '';
  if(!D.limits.length){ box.textContent = 'Лимиты не заданы.'; return; }
  D.limits.forEach(l => {
    // Лимит 0 — категория закрыта: любая трата в ней перебор, а не «0 %».
    const pct = l.limit ? Math.round(l.used / l.limit * 100)
                        : (l.used ? 100 : 0);
    box.appendChild(line(l.cat, '', money(l.used) + ' / ' + money(l.limit),
                         pct >= 100 && l.used ? 'over' : pct >= 80 ? 'near' : ''));
  });
  if(D.month.from_savings){
    box.appendChild(line('Из накоплений', 'в лимиты не входит',
                         money(D.month.from_savings) + ' с'));
  }
  $('#nolimit').textContent = D.no_limit.join(' · ') || 'нет';
}

function drawMonth(){
  const m = D.month, box = $('#month'); box.innerHTML = '';
  [['Заработано', m.income], ['Потрачено', m.spent],
   ['Отложено', m.saved], ['Погашено долга', m.debt],
   ['Было к началу месяца', m.carry], ['Остаток (кэш)', m.cash]
  ].forEach(([k, v]) => box.appendChild(line(k, '', money(v) + ' с')));

}

/* Привычка: вопрос за сегодня одним тапом, неделя, доля от плана и
   причины пропусков. Ни очков, ни уровней: внешняя награда вытесняет
   интерес, а полоска, которую рисуешь себе сам, к третьей неделе
   перестаёт что-либо значить. */
async function answerHabit(name, answer, why){
  const j = await post('/api/habit', {name, answer, why});
  note(j.ok ? (j.line || 'Записал') : (j.error || 'Не вышло'));
  if(j.ok) load();
}

function drawHabits(){
  const box = $('#pHabits'); box.innerHTML = '';
  if(!(D.habits || []).length){
    box.innerHTML = '<div class="card dim">Привычек нет. Заведи их в листе '
                  + '«Настройки привычек».</div>';
    return;
  }
  D.habits.forEach(h => {
    const card = document.createElement('div'); card.className = 'card';
    const head = document.createElement('div');
    head.innerHTML = `<b>${h.name}</b> <span class="dim">· вопрос в ${h.at}</span>
      <div class="dim num" style="font-size:13px;margin-top:2px">
        ${h.done_week} из ${h.plan} на этой неделе · всего ${h.done_all}${
          h.skipped_all ? ', пропусков ' + h.skipped_all : ''}</div>`;
    card.appendChild(head);

    const wk = document.createElement('div'); wk.className = 'week';
    h.week.forEach(d => {
      const c = document.createElement('div');
      c.className = [d.answer === 'был' ? 'was' : d.answer === 'не был' ? 'no' : '',
                     d.planned ? 'plan' : '', d.future ? 'fut' : ''].join(' ');
      c.innerHTML = d.day + '<b>' + (d.answer === 'был' ? '✓'
                    : d.answer === 'не был' ? '–' : '·') + '</b>';
      wk.appendChild(c);
    });
    card.appendChild(wk);

    const ask = document.createElement('div'); ask.className = 'two-go';
    [['Был', 'был'], ['Не был', 'не был']].forEach(([label, val]) => {
      const b = document.createElement('button');
      b.className = 'go' + (h.today === val ? '' : ' flat');
      b.textContent = label;
      b.onclick = () => answerHabit(h.name, val, '');
      ask.appendChild(b);
    });
    card.appendChild(ask);

    // Причину спрашиваем только когда пропуск: «почему» вместо молчаливого
    // минуса — ради этого причины и копятся.
    if(h.today === 'не был'){
      const lbl = document.createElement('h2'); lbl.textContent = 'Что помешало';
      const ch = document.createElement('div'); ch.className = 'chips';
      h.reasons.forEach(r => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = r;
        b.onclick = () => answerHabit(h.name, '', r);
        ch.appendChild(b);
      });
      card.append(lbl, ch);
    }
    box.appendChild(card);

    if(h.why.length){
      const t = document.createElement('h2'); t.textContent = 'Почему пропускал';
      const c2 = document.createElement('div'); c2.className = 'card';
      h.why.forEach(([w, n]) => c2.appendChild(line(w, '', n + ' раз')));
      box.append(t, c2);
    }
  });
}

function drawLast(){
  const box = $('#last'); box.innerHTML = '';
  if(!D.last.length){ box.textContent = 'Пока пусто.'; return; }
  D.last.forEach(o => {
    const where = o.kind === 'Перевод' ? o.wallet + ' → ' + o.to : o.wallet;
    const d = line(money(o.amount) + ' с · ' + o.cat,
                   [o.date, where, o.comment].filter(Boolean).join(' · '), '');
    const b = document.createElement('button');
    b.className = 'x'; b.type = 'button'; b.textContent = '×';
    b.title = 'Убрать';
    b.onclick = async () => {
      if(!confirm('Удалить запись?')) return;
      const j = await post('/api/drop', {line: o.line, cat: o.cat,
                                         amount: o.amount});
      note(j.ok ? 'Убрал' : (j.error || 'Не вышло'));
      if(j.ok) load();
    };
    d.lastChild.replaceWith(b);
    box.appendChild(d);
  });
}

async function load(){
  const r = await fetch('/api/init?initData=' + encodeURIComponent(initData));
  const j = await r.json();
  if(!j.ok){
    document.body.innerHTML = '<div class="card">'
      + (j.error || 'Не открылось') + '</div>';
    return;
  }
  D = j;
  if(!$('#date').value) $('#date').value = j.today;
  drawTop(); drawCats(); drawWallets(); drawBal();
  drawLimits(); drawMonth(); drawLast(); drawHabits(); drawDebts();
  drawTasks(); drawQuick(); drawTiles(); drawTrend();
  drawMeas(); drawGoals(); drawMatrix(); drawMGoals(); drawCycle();
  if(FIRST){ FIRST = false; show('today'); }
}

/* Навигация: нижняя панель как у Lifehub — палец достаёт, всегда видно,
   где ты. Внутри раздела чипы подразделов. Верхняя полоса вкладок
   этого не давала: она уезжала при прокрутке и мешала уровни. */
const BLOCKS = {
  today: {name: 'Сегодня', subs: [['Quick', 'Сегодня'], ['Set', 'Настроить']],
    settings: ['screen']},
  money: {name: 'Деньги', subs: [
    ['Write', 'Записать'], ['Limits', 'Лимиты'], ['Wallets', 'Кошельки'],
    ['Debts', 'Долги'], ['MGoals', 'Цели'], ['Trend', 'Динамика'],
    ['Month', 'Итог'], ['Set', 'Настроить']],
    settings: ['limits', 'wallets', 'debts', 'goals_money']},
  body: {name: 'Ритм', subs: [['Habits', 'Привычки'], ['Meas', 'Меры'],
    ['Set', 'Настроить']], settings: ['habits', 'measures']},
  todo: {name: 'Дела', subs: [['Tasks', 'Список'], ['Matrix', 'Матрица']]},
  goals: {name: 'Цели', subs: [['Goals', 'Проекты'], ['Cycle', 'Цикл'],
    ['Set', 'Настроить']], settings: ['projects', 'cycle']},
};
const PAGES = ['Quick', 'Write', 'Limits', 'Wallets', 'Debts', 'Trend',
               'Month', 'Habits', 'Meas', 'Tasks', 'Matrix', 'Goals', 'Set',
               'MGoals', 'Cycle'];
let TAB = 'today';

function show(block, sub){
  const b = BLOCKS[block]; if(!b) return;
  TAB = block;
  PAGES.forEach(n => $('#p' + n).classList.add('hide'));
  const want = sub || b.subs[0][0];
  $('#p' + want).classList.remove('hide');
  if(want === 'Set') drawSet(null, b.settings || []);
  // Чипы показываем только там, где подразделов больше одного.
  const many = b.subs.length > 1;
  $('#subHead').classList.toggle('hide', !many);
  const box = $('#subs'); box.innerHTML = '';
  if(many) b.subs.forEach(([id, label]) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = label;
    if(id === want) btn.className = 'on';
    btn.onclick = () => show(block, id);
    box.appendChild(btn);
  });
  document.querySelectorAll('#bar button').forEach(x =>
    x.classList.toggle('on', x.dataset.b === block));
  // Крупное число — про деньги, поэтому висит только там и на входе.
  $('#topLine').classList.toggle('hide', !['today', 'money'].includes(block));
  window.scrollTo(0, 0);
}

document.querySelectorAll('#bar button').forEach(x =>
  x.onclick = () => show(x.dataset.b));

/* Кнопки входа не заводят второй формы записи — открывают «Записать»

}

$('#fab').onclick = () => go('расход');
$('#qSpend').onclick = () => go('расход');
$('#qMove').onclick = () => go('перевод');
$('#qIn').onclick = () => go('доход');
$('#qTask').onclick = () => { show('todo'); $('#tText').focus(); };

/* Плитки-метрики: то, ради чего открывают приложение, без прокрутки. */
/* Меры: число с целью. Цели нет — показываем «цель не задана» и просто
   копим: выдуманный ориентир хуже, чем его отсутствие. */
function drawMeas(){
  const box = $('#pMeas'); box.innerHTML = '';
  const list = D.measures || [];
  if(!list.length){
    box.innerHTML = '<div class="card dim">Мер пока нет. Заведи их '
                  + 'в «Цели → Настроить → measures».</div>';
    return;
  }
  list.forEach(m => {
    const c = document.createElement('div'); c.className = 'card';
    const head = document.createElement('div');
    head.innerHTML = '<b>' + m.name + '</b> <span class="dim">· '
      + (m.goal ? (m.better === 'меньше' ? 'не больше ' : 'не меньше ')
                  + m.goal + ' ' + m.unit
                : 'цель не задана') + '</span>';
    const now = document.createElement('div');
    now.className = 'big num';
    now.style.fontSize = '30px'; now.style.margin = '8px 0 2px';
    now.textContent = m.today != null ? m.today
                    : (m.last ? m.last.value : '—');
    if(m.hit === true) now.style.color = 'var(--ok)';
    if(m.hit === false) now.style.color = 'var(--bad)';
    const when = document.createElement('div');
    when.className = 'dim'; when.style.fontSize = '12px';
    when.textContent = m.today != null ? 'сегодня'
      : (m.last ? 'последнее ' + m.last.date : 'ещё не вводилось');
    const row = document.createElement('div'); row.className = 'two';
    const inp = document.createElement('input');
    inp.inputMode = 'decimal'; inp.placeholder = m.unit || 'значение';
    inp.id = 'meas_' + m.name;
    const b = document.createElement('button');
    b.className = 'go'; b.style.marginTop = '0'; b.style.width = '40%';
    b.textContent = 'Записать';
    b.onclick = async () => {
      const j = await post('/api/measure', {name: m.name, value: inp.value});
      note(j.ok ? j.line : (j.error || 'Не вышло'));
      if(j.ok) load();
    };
    row.append(inp, b);
    c.append(head, now, when, row);
    if(m.history.length > 1){
      const h = document.createElement('div');
      h.className = 'dim num'; h.style.fontSize = '12px';
      h.style.marginTop = '8px';
      h.textContent = m.history.slice(0, 7).map(x =>
        x.date.slice(5) + ' ' + x.value).join(' · ');
      c.appendChild(h);
    }
    box.appendChild(c);
  });
}

/* Проекты. Этапы и деньги показываем рядом, но не делим одно на другое:
   задачи не равны по весу, и «50 % задач» ничего не значит. */
function drawGoals(){
  const box = $('#pGoals'); box.innerHTML = '';
  const list = D.projects || [];
  if(!list.length){
    box.innerHTML = '<div class="card dim">Проектов нет. Заведи '
                  + 'в «Настроить → projects».</div>';
    return;
  }
  list.forEach(p => {
    const c = document.createElement('div'); c.className = 'card';
    let html = '<b>' + p.name + '</b>';
    if(p.goal) html += '<div class="dim" style="font-size:13px;margin-top:2px">'
                     + p.goal + '</div>';
    c.innerHTML = html;
    c.appendChild(line('Этапы', p.next_step ? 'следующий: ' + p.next_step.text
                                            : 'все закрыты',
                       p.steps_done + ' из ' + p.steps_total));
    c.appendChild(line('Потрачено',
                       p.cat ? 'по категории «' + p.cat + '»' : '',
                       money(p.spent) + ' с'));
    if(p.budget) c.appendChild(line('Бюджет', '', money(p.budget) + ' с'));
    if(p.due) c.appendChild(line('Срок', '', p.due));
    if(p.habit_state) c.appendChild(line('Привычка',
      p.habit_state.name, p.habit_state.done_week + ' из '
      + p.habit_state.plan + ' на неделе'));
    // Полоска уместна: у этапов срок назначен извне, а не собой.
    const bar = document.createElement('div'); bar.className = 'mbar';
    const i = document.createElement('i');
    i.style.width = (p.steps_total ? p.steps_done / p.steps_total * 100 : 0)
                    + '%';
    bar.appendChild(i); c.appendChild(bar);
    box.appendChild(c);
  });
}

/* Цикл: гипотезы на 30 дней. Метрики разделены на опережающие («что я
   делаю») и запаздывающие («что из этого вышло») — без этого деления
   разбор не отвечает на вопрос «работало или нет»: можно было делать
   и не получить, а можно не делать и получить случайно. */
function drawCycle(){
  const box = $('#pCycle'); box.innerHTML = '';
  const C = D.cycle || {rows: [], ends: '', days_left: null};
  if(!C.rows.length){
    box.innerHTML = '<div class="card dim">Гипотез нет. Заведи '
                  + 'в «Настроить → Цикл»: блок, гипотеза, метрика, вид '
                  + '(опережающая или запаздывающая), план, источник '
                  + '(привычка / мера / дела / записи трат), начало и конец.'
                  + '</div>';
    return;
  }
  if(C.days_left !== null){
    const h = document.createElement('div'); h.className = 'card';
    h.appendChild(line('Разбор', C.ends.split('-').reverse().join('.'),
                       C.days_left >= 0 ? 'через ' + C.days_left + ' дн.'
                                        : 'просрочен',
                       C.days_left < 0 ? 'over'
                                       : C.days_left <= 3 ? 'near' : ''));
    box.appendChild(h);
  }
  [[true, 'Что делаю'], [false, 'Что выходит']].forEach(([lead, title]) => {
    const list = C.rows.filter(r => r.lead === lead);
    if(!list.length) return;
    const h = document.createElement('h2'); h.textContent = title;
    const c = document.createElement('div'); c.className = 'card';
    list.forEach(r => {
      c.appendChild(line(r.metric, r.block + (r.idea ? ' · ' + r.idea : ''),
                         money(r.fact) + ' из ' + money(r.plan)));
      const bar = document.createElement('div'); bar.className = 'mbar';
      const i = document.createElement('i');
      i.style.width = Math.min(r.pct, 100) + '%';
      bar.appendChild(i); c.appendChild(bar);
    });
    box.append(h, c);
  });
}

/* Матрица Эйзенхауэра — второй взгляд на тот же список. Срочность берём
   из срока, важность из пометки «главная». */
function drawMatrix(){
  const box = $('#pMatrix'); box.innerHTML = '';
  const T = D.tasks || {late: [], today: [], later: []};
  const all = [...T.late, ...T.today, ...T.later];
  const urgent = t => !t.due || t.due <= D.today ? !!t.due : t.due <= D.today;
  const quads = [
    ['Срочно и важно', t => t.top && urgent(t), 'over'],
    ['Важно, не срочно', t => t.top && !urgent(t), ''],
    ['Срочно, не важно', t => !t.top && urgent(t), 'near'],
    ['Ни то, ни другое', t => !t.top && !urgent(t), 'dim'],
  ];
  quads.forEach(([title, test, cls]) => {
    const list = all.filter(test);
    const h = document.createElement('h2');
    h.textContent = title + ' · ' + list.length;
    if(cls && cls !== 'dim') h.className = cls;
    const c = document.createElement('div'); c.className = 'card';
    if(!list.length) c.innerHTML = '<span class="dim">пусто</span>';
    list.forEach(t => c.appendChild(taskRow(t)));
    box.append(h, c);
  });
}

/* Настройки. Одна форма на все виды: настройки — это строки в листах,
   и своего экрана на каждый вид не нужно. */
let SET_KIND = 'habits', SET_KINDS = [];
async function drawSet(kind, kinds0){
  // Виды приходят от блока: категории настраиваются там, где ими
  // пользуются, а не в одной общей свалке.
  if(kinds0) SET_KINDS = kinds0;
  const kinds = SET_KINDS;
  if(kind) SET_KIND = kind;
  if(!kinds.includes(SET_KIND)) SET_KIND = kinds[0];
  const RU = {habits: 'Привычки', measures: 'Меры', limits: 'Категории',
              wallets: 'Кошельки', debts: 'Долги', projects: 'Проекты',
              goals_money: 'Цели', screen: 'Экран «Сегодня»', cycle: 'Цикл'};
  const chips = $('#setKinds'); chips.innerHTML = '';
  kinds.forEach(k => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = RU[k] || k;
    if(k === SET_KIND) b.className = 'on';
    b.onclick = () => drawSet(k);
    chips.appendChild(b);
  });
  const box = $('#setList');
  box.innerHTML = '<div class="card dim">Читаю…</div>';
  const j = await post('/api/settings', {kind: SET_KIND});
  box.innerHTML = '';
  if(!j.ok){ box.innerHTML = '<div class="card">' + j.error + '</div>'; return; }
  const form = (row) => {
    const c = document.createElement('div'); c.className = 'card';
    const ins = j.columns.map((col, i) => {
      const w = document.createElement('div');
      w.innerHTML = '<div class="dim" style="font-size:11.5px;margin-top:6px">'
                  + col + '</div>';
      const inp = document.createElement('input');
      inp.value = row ? (row.values[i] || '') : '';
      w.appendChild(inp); c.appendChild(w);
      return inp;
    });
    const g = document.createElement('div'); g.className = 'two-go';
    const save = document.createElement('button');
    save.className = 'go'; save.textContent = row ? 'Сохранить' : 'Добавить';
    save.onclick = async () => {
      const r = await post('/api/settings_save', {kind: SET_KIND,
        line: row ? row.line : 0, values: ins.map(x => x.value)});
      note(r.ok ? r.line : (r.error || 'Не вышло'));
      if(r.ok){ await load(); drawSet(); }
    };
    g.appendChild(save);
    if(row){
      const del = document.createElement('button');
      del.className = 'go flat'; del.textContent = 'Убрать';
      del.onclick = async () => {
        if(!confirm('Убрать «' + row.values[0] + '»?')) return;
        const r = await post('/api/settings_drop', {kind: SET_KIND, line: row.line});
        note(r.ok ? r.line : (r.error || 'Не вышло'));
        if(r.ok){ await load(); drawSet(); }
      };
      g.appendChild(del);
    }
    c.appendChild(g);
    return c;
  };
  j.rows.forEach(r => {
    const head = document.createElement('h2');
    head.textContent = r.values[0];
    const wrap = document.createElement('div');
    wrap.className = 'hide';
    wrap.appendChild(form(r));
    head.style.cursor = 'pointer';
    head.onclick = () => wrap.classList.toggle('hide');
    box.append(head, wrap);
  });
  const add = document.createElement('h2'); add.textContent = '+ Добавить';
  const wrap = document.createElement('div'); wrap.className = 'hide';
  wrap.appendChild(form(null));
  add.style.cursor = 'pointer';
  add.onclick = () => wrap.classList.toggle('hide');
  box.append(add, wrap);
}

/* Цели по деньгам. Лимит говорит «не больше», цель — «достигни».
   Факт считается сам: цель, которую надо обновлять руками, не живёт. */
function drawMGoals(){
  const box = $('#pMGoals'); box.innerHTML = '';
  const list = D.goals_money || [];
  if(!list.length){
    box.innerHTML = '<div class="card dim">Целей нет. Заведи в «Настроить → '
                  + 'Цели»: тип — откладывать в месяц, накопить или '
                  + 'закрыть долг.</div>';
    return;
  }
  list.forEach(g => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = '<b>' + g.name + '</b>'
      + '<div class="dim" style="font-size:12.5px">' + g.kind
      + (g.due ? ' · до ' + g.due : '') + '</div>';
    c.appendChild(line(money(g.fact) + ' из ' + money(g.amount), g.unit,
                       g.pct + ' %', g.done ? '' : g.pct < 50 ? 'near' : ''));
    const bar = document.createElement('div'); bar.className = 'mbar';
    const i = document.createElement('i');
    i.style.width = Math.min(g.pct, 100) + '%';
    if(g.done) i.style.background = 'var(--ok)';
    bar.appendChild(i); c.appendChild(bar);
    box.appendChild(c);
  });
}

function drawTiles(){
  const m = D.month, T = D.tasks || {late: [], today: []};
  const plan = D.limits.reduce((s, l) => s + l.limit, 0);
  const left = plan - m.spent;
  const debt = (D.debts || []).reduce((s, d) => s + d.left, 0);
  const gym = (D.habits || [])[0];
  // «Свободно» уже стоит крупно сверху — вторая такая же плитка была бы
  // той самой второй правдой об одном числе.
  const tiles = [
    ['🐖', money(m.put_away) + ' с', 'Отложено', m.put_away ? 'good' : ''],
    ['📉', money(left) + ' с', 'Осталось по плану', left < 0 ? 'bad' : ''],
    ['🏦', debt ? money(debt) + ' с' : '—', 'Долг', debt ? 'warn' : ''],
    [gym ? '🏋' : '✓',
     gym ? gym.done_week + ' из ' + gym.plan : T.today.length,
     gym ? gym.name + ' на неделе' : 'Дел сегодня', ''],
  ];
  const box = $('#qTiles'); box.innerHTML = '';
  tiles.forEach(([ic, val, cap, cls]) => {
    const d = document.createElement('div'); d.className = 'tile';
    d.innerHTML = '<div class="ic">' + ic + '</div><div class="v ' + cls
                + '">' + val + '</div><div class="c">' + cap + '</div>';
    box.appendChild(d);
  });
}

/* Столбики по месяцам. Высота от самого большого значения на экране —
   иначе три похожих месяца выглядят одинаково. */
function drawTrend(){
  const t = D.trend || [];
  const box = $('#chart'), labs = $('#chartLabs');
  box.innerHTML = ''; labs.innerHTML = '';
  const max = Math.max(1, ...t.map(x => Math.max(x.income, x.spent, x.saved)));
  t.forEach(x => {
    const col = document.createElement('div'); col.className = 'col';
    [['inc', x.income], ['sp', x.spent], ['sv', x.saved]].forEach(([c, v]) => {
      if(!v) return;
      const i = document.createElement('i');
      i.className = c; i.style.height = Math.round(v / max * 96) + 'px';
      i.title = money(v);
      col.appendChild(i);
    });
    box.appendChild(col);
    const l = document.createElement('div');
    l.className = 'lab'; l.style.flex = '1'; l.textContent = x.label;
    labs.appendChild(l);
  });

  const ct = D.cat_trend || {months: [], rows: []};
  const cbox = $('#catTrend'); cbox.innerHTML = '';
  if(!ct.rows.length){
    cbox.innerHTML = '<span class="dim">Записей пока нет.</span>';
    return;
  }
  const head = document.createElement('div'); head.className = 'row';
  head.innerHTML = '<div class="name dim" style="font-size:12px">Категория</div>'
    + ct.months.map(mm => '<div class="val dim" style="font-size:12px;width:52px">'
        + mm.slice(5) + '</div>').join('');
  cbox.appendChild(head);
  ct.rows.forEach(r => {
    const d = document.createElement('div'); d.className = 'row';
    d.innerHTML = '<div class="name">' + r.cat + '</div>'
      + r.values.map(v => '<div class="val num" style="width:52px">'
          + (v ? money(v) : '—') + '</div>').join('');
    cbox.appendChild(d);
  });
}

$('#kind').onchange = () => { drawCats(); drawWallets(); };

$('#save').onclick = async () => {
  if(BUSY) return;
  const amount = $('#amount').value.trim();
  if(!amount){ note('Впиши сумму'); return; }
  BUSY = true; $('#save').disabled = true;
  try{
    const kind = $('#kind').value;
    // Единственное место, где переспрашиваем: деньги из отложенного
    // тратятся редко и осознанно, и комментарий тут нужен.
    if(kind === 'расход' && D.save_wallet && WAL === D.save_wallet){
      if(!$('#comment').value.trim()){
        note('Трата из накоплений — напиши, на что'); BUSY = false;
        $('#save').disabled = false; return;
      }
      if(!confirm(`Потратить ${amount} из накоплений?`)){
        BUSY = false; $('#save').disabled = false; return;
      }
    }
    const j = kind === 'перевод'
      ? await post('/api/transfer', {amount, from: WAL, to: TO,
                                     comment: $('#comment').value.trim(),
                                     date: $('#date').value})
      : await post('/api/add', {amount, cat: CAT, kind,
                                comment: $('#comment').value.trim(),
                                date: $('#date').value, wallet: WAL});
    if(j.ok){
      note(j.line.replace(/<[^>]+>/g, ''));
      $('#amount').value = ''; $('#comment').value = '';
      await load();
    } else note(j.error || 'Не записалось');
  } finally { BUSY = false; $('#save').disabled = false; }
};

load();
</script>
