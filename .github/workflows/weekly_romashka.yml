name: Ромашка — Недельный отчёт

on:
  schedule:
    # Понедельник 07:00 Душанбе = 02:00 UTC (UTC+5)
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Установить зависимости
        run: pip install requests google-auth google-auth-httplib2
      - name: Отправить недельный отчёт
        run: python scripts/ops_weekly.py --send
        env:
          ROMASHKA_SA_JSON: ${{ secrets.ROMASHKA_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
