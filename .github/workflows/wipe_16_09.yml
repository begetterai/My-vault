name: Ромашка — разовая очистка журналов 16.09

# Решение Азиза 15.09.2026: перед расчётным периодом 16–31 стереть всё,
# что сотрудники наделали до 16-го. Обучение и ознакомление остаются —
# иначе люди перечитывают 46 регламентов заново.
#
# Почему Actions, а не сессия Claude: ключ от таблицы лежит в .gitignore,
# в свежем контейнере его нет. Здесь секрет уже настроен.
#
# Разовая: срабатывает только 16 сентября. После прогона файл удаляется.
on:
  schedule:
    # 01:00 UTC = 06:00 Душанбе, 16 сентября
    - cron: '0 1 16 9 *'
  workflow_dispatch:

jobs:
  wipe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: pip install requests google-auth google-auth-httplib2

      # Копия обязательна и идёт первой. Упадёт — очистки не будет:
      # правило Азиза после 14.09, когда 56 снимков ушли безвозвратно.
      - name: Копия таблицы перед очисткой
        run: python3 scripts/backup_before_wipe.py
        env:
          ROMASHKA_SA_JSON: ${{ secrets.ROMASHKA_SA_JSON }}

      # Показ до дела: в логе остаётся, что именно собирались стереть.
      - name: Показать, что будет стёрто
        run: python3 scripts/clear_pilot_data.py
        env:
          ROMASHKA_SA_JSON: ${{ secrets.ROMASHKA_SA_JSON }}

      # Без --all: строки с датой 16.09 остаются, это уже новый период.
      # Если Actions опоздает и смена успеет отметиться, её работа цела.
      - name: Стереть
        run: python3 scripts/clear_pilot_data.py --go
        env:
          ROMASHKA_SA_JSON: ${{ secrets.ROMASHKA_SA_JSON }}
